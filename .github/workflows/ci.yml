name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bcrypt pytest pytest-asyncio httpx
          # Install project deps without optional heavy ML packages
          pip install fastapi uvicorn[standard] python-dotenv pydantic pydantic-settings \
                      python-multipart PyPDF2 pdfplumber python-pptx pymupdf httpx openai \
                      Pillow pillow-heif bcrypt 2>/dev/null || true

      - name: Run pytest
        env:
          DEMO_ENABLED: "false"
          GROQ_API_KEY: ""
          AZURE_OPENAI_API_KEY: ""
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test
